version = 1

# Java files carry their own SPDX headers. This file marks everything that
# can't hold one.

[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    "**/*.mods.toml",
    "scripts/*.py",
    "scripts/*.sh",
    "**/*.md",
    "src/main/resources/**/*.json",
    "src/gametest/resources/**",
    "src/main/resources/**/*.nbt",
    "LICENSE",
    "publish/summary.txt",
    ".github/**",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "MIT"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"

# Vendored from Oritech v1.2.12 (https://github.com/Rearth/Oritech), which is CC0 1.0: its fluid
# pipe and small tank models and textures, renamed and retextured to this Library's ids; the
# creative pipe's texture is a retint of the pipe's. None of it is from the ArtOfTecharium or
# unused-textures sets its README lists as CC BY-NC and CC BY.
[[annotations]]
path = [
    "src/main/resources/assets/pipeworks/models/block/pipe_core.json",
    "src/main/resources/assets/pipeworks/models/block/pipe_arm.json",
    "src/main/resources/assets/pipeworks/models/block/pipe_straight.json",
    "src/main/resources/assets/pipeworks/models/block/storage_tank.json",
    "src/main/resources/assets/pipeworks/textures/block/pipe.png",
    "src/main/resources/assets/pipeworks/textures/block/storage_tank.png",
    "src/main/resources/assets/pipeworks/textures/block/creative_pipe.png",
]
precedence = "override"
SPDX-FileCopyrightText = "Rearth"
SPDX-License-Identifier = "CC0-1.0"

# The cover and icon are drawn by publish/make-cover.py from the pipe and tank textures above.
[[annotations]]
path = ["publish/*.png"]
SPDX-FileCopyrightText = ["Rearth", "2026 5thlayer"]
SPDX-License-Identifier = "CC0-1.0 AND MIT"
