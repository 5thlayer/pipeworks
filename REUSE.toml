version = 1

# Java files carry their own SPDX headers. This file marks everything that
# can't hold one.

[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    ".gitattributes",
    ".claude/settings.json",
    ".gitmodules",
    "**/*.mods.toml",
    "**/*.md",
    "src/main/resources/**/*.json",
    "src/main/resources/**/*.nbt",
    "src/gametest/resources/**/*.nbt",
    "src/main/resources/gallery_pack/**",
    "LICENSE",
    "NOTICE",
    "publish/summary.txt",
    ".github/**",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "MIT"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"

# Vendored from Oritech v1.2.12 (https://github.com/Rearth/Oritech), which is CC0 1.0: its fluid
# pipe and small tank models and textures, renamed and retextured to this Module's ids, the
# textures' copper retinted to iron grey by 5thlayer; the creative pipe's texture is a retint of
# the pipe's, and the tank's cap and glass parts are cut from its model by
# tools/storage_tank_models.py. None of it is from the ArtOfTecharium or
# unused-textures sets its README lists as CC BY-NC and CC BY.
[[annotations]]
path = [
    "src/main/resources/assets/pipeworks/models/block/pipe_core.json",
    "src/main/resources/assets/pipeworks/models/block/pipe_arm.json",
    "src/main/resources/assets/pipeworks/models/block/pipe_straight.json",
    "src/main/resources/assets/pipeworks/models/block/storage_tank.json",
    "src/main/resources/assets/pipeworks/models/block/storage_tank_cap_*.json",
    "src/main/resources/assets/pipeworks/models/block/storage_tank_glass_*.json",
    "src/main/resources/assets/pipeworks/textures/block/pipe.png",
    "src/main/resources/assets/pipeworks/textures/block/storage_tank.png",
    "src/main/resources/assets/pipeworks/textures/block/creative_pipe.png",
]
precedence = "override"
SPDX-FileCopyrightText = ["Rearth", "2026 5thlayer"]
SPDX-License-Identifier = "CC0-1.0"

# The cover and icon are drawn by publish/make-cover.py from the pipe and tank textures above
# and Minecraft's fluid textures, which stay Mojang's; see LICENSES/LicenseRef-Mojang.txt.
[[annotations]]
path = ["publish/*.png"]
SPDX-FileCopyrightText = ["Mojang AB", "Rearth", "2026 5thlayer"]
SPDX-License-Identifier = "LicenseRef-Mojang AND CC0-1.0 AND MIT"

# The Pump's and the Outlet's textures (#31), written by tools/machine_textures.py from the tiles in
# tools/textures, which are copied unchanged: Malcolm Riley's unused-textures at 8b85ad73
# (https://github.com/malcolmriley/unused-textures), CC BY 4.0, retinted by 5thlayer, and Oritech
# v1.2.12's fluid duct, CC0 1.0, whose ring is laid over the faces that join pipes.
[[annotations]]
path = ["tools/textures/unused-textures/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "Malcolm Riley"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["tools/textures/oritech/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "Rearth"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
    "src/main/resources/assets/pipeworks/textures/block/pump_front.png",
    "src/main/resources/assets/pipeworks/textures/block/pump_top.png",
    "src/main/resources/assets/pipeworks/textures/block/outlet_casing.png",
    "src/main/resources/assets/pipeworks/textures/block/outlet_step.png",
    "src/main/resources/assets/pipeworks/textures/block/outlet_nozzle.png",
]
precedence = "override"
SPDX-FileCopyrightText = ["Malcolm Riley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
    "src/main/resources/assets/pipeworks/textures/block/machine_side.png",
    "src/main/resources/assets/pipeworks/textures/block/outlet_mouth.png",
]
precedence = "override"
SPDX-FileCopyrightText = ["Malcolm Riley", "Rearth", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0 AND CC0-1.0"
