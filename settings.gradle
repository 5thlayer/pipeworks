pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        // The libworks convention plugin, which releases to ~/.m2 only.
        mavenLocal()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'pipeworks'
